apply plugin: 'com.android.application'

android {
    namespace = "com.opgtr.echo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.opgtr.echo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes these; local builds get 1 / the version in package.json.
        versionCode((System.getenv("ECHO_VERSION_CODE") ?: "1") as Integer)
        versionName(System.getenv("ECHO_VERSION_NAME") ?: echoVersion())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Only the private key from GitHub secrets (see README.md). No
            // fallback: the old shared key is public and must never sign alone
            // again. Without the secret, a release build fails.
            def own = System.getenv("ECHO_KEYSTORE_FILE")
            if (own && file(own).exists()) {
                storeFile file(own)
                storePassword System.getenv("ECHO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ECHO_KEY_ALIAS")
                keyPassword System.getenv("ECHO_KEY_PASSWORD") ?: System.getenv("ECHO_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Unsigned without the secret key: the CI then refuses to publish it.
            signingConfig (System.getenv("ECHO_KEYSTORE_FILE") ? signingConfigs.release : null)
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // One APK per processor type: the embedded Node.js is ~60 MB per type.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk false
        }
    }
    packaging {
        // Compressed in the APK (a much smaller download), unpacked at install.
        jniLibs { useLegacyPackaging = true }
    }
}

def echoVersion() {
    def pkg = new groovy.json.JsonSlurper().parse(file("../../package.json"))
    return pkg.version
}



repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The player: ExoPlayer, media session (notification, lock screen), Cast
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    implementation "androidx.media3:media3-cast:1.5.1"
    implementation "androidx.mediarouter:mediarouter:1.7.0"
    implementation "com.google.android.gms:play-services-cast-framework:22.0.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
