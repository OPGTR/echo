name: Android APK

# Builds Écho. On main, each version gets its own release (v0.1.0, …) with
# its patch notes (release-notes/<version>.md); older versions are kept.
on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ECHO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the interface and the server
        run: npm run build

      - name: Test the server under the phone's limits (Node 18, no ICU)
        timeout-minutes: 20
        run: |
          set -o pipefail
          # Where it is slow or stuck shows as notices (job logs aren't always readable).
          step() { echo "::notice::$(date -u +%H:%M:%S) $1"; }
          # ffmpeg for the test songs. A slow package mirror must not hold the
          # build for an hour: short timeouts and retries.
          if ! command -v ffmpeg > /dev/null; then
            step "installing ffmpeg"
            apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            timeout 300 sudo apt-get $apt_opts update -qq || echo "::warning::apt-get update was slow or failed"
            timeout 600 sudo apt-get $apt_opts install -y -qq --no-install-recommends ffmpeg > /dev/null || { echo "::error::ffmpeg could not be installed"; exit 1; }
          fi
          step "ffmpeg ready, getting Node 18"
          npm pack node-linux-x64@18.20.4 --silent --pack-destination "$RUNNER_TEMP" > /dev/null
          tar xzf "$RUNNER_TEMP/node-linux-x64-18.20.4.tgz" -C "$RUNNER_TEMP"
          step "smoke test"
          if ! timeout 600 node scripts/smoke-test.mjs "$RUNNER_TEMP/package/bin/node" 2>&1 | tee smoke.log; then
            echo "::error::smoke test failed or stuck; last lines below"
            tail -25 smoke.log | sed 's/^/::error::/' | cut -c1-400
            exit 1
          fi
          step "smoke test done"

      - name: Real network check (report)
        continue-on-error: true
        run: |
          bash scripts/make-test-music.sh "$RUNNER_TEMP/music"
          node scripts/network-check.mjs "$RUNNER_TEMP/music" "$RUNNER_TEMP/package/bin/node" 2>&1 | tee network-report.txt

      - name: Version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "ECHO_VERSION_NAME=${version}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Signing key (from secrets, required)
        env:
          KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ECHO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
        run: |
          # Without the key the APKs are still built (to check the code), but
          # never signed nor published (see "Collect").
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::Clé de signature absente : ajoute ECHO_KEYSTORE_BASE64, ECHO_KEYSTORE_PASSWORD, ECHO_KEY_ALIAS et ECHO_KEY_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 0
          fi
          # Tolerant of a copy-paste: spaces, line breaks or a label before the
          # key ("MII..." is how every keystore starts in base64).
          clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          case "$clean" in *MII*) clean="MII${clean#*MII}" ;; esac
          echo "::notice::Clé : ${#KEYSTORE_BASE64} caractères reçus, ${#clean} gardés, début « ${clean:0:4} »"
          printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/echo.keystore" || { echo "::error::ECHO_KEYSTORE_BASE64 n'est pas un base64 valide."; exit 1; }
          # The password must open it, and the alias must be in it (only names are shown).
          if ! keytool -list -keystore "$RUNNER_TEMP/echo.keystore" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::La clé ne s'ouvre pas avec ECHO_KEYSTORE_PASSWORD (ou ECHO_KEYSTORE_BASE64 est incomplet)."; grep -v -i pass "$RUNNER_TEMP/ks.txt" | head -5; exit 1
          fi
          grep -iq "^${KEY_ALIAS}," "$RUNNER_TEMP/ks.txt" || { echo "::error::L'alias « $KEY_ALIAS » (ECHO_KEY_ALIAS) n'est pas dans la clé."; grep -E "^[^ ]+, " "$RUNNER_TEMP/ks.txt" | cut -d, -f1; exit 1; }
          {
            echo "ECHO_KEYSTORE_FILE=$RUNNER_TEMP/echo.keystore"
            echo "ECHO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ECHO_KEY_ALIAS=$KEY_ALIAS"
            echo "ECHO_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build the APKs
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Build log (when it fails)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || exit 0
          grep -nE "error:|warning: \[|What went wrong|FAILED|Exception|e: " build.log | head -200 > build-errors.txt || true
          tail -150 build.log >> build-errors.txt
          gh release view ci-logs > /dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI logs" --notes "Build logs" --target "$GITHUB_SHA"
          gh release upload ci-logs build-errors.txt --clobber

      - name: Collect, signed with the key rotation (old public key -> new private key)
        run: |
          set -e
          exec > >(tee collect.log) 2>&1
          # The old shared key is public: nothing is ever signed with it alone again.
          if [ -z "$ECHO_KEYSTORE_FILE" ]; then echo "::error::Pas de clé de signature privée (secrets GitHub) : rien n'est signé ni publié."; exit 1; fi
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          signer="$tools/apksigner"
          old=android/rotation/old-public.keystore
          # The proof that the new key takes over from the old one (Android 9+):
          # phones with Écho installed accept the update, and from then on refuse
          # anything signed with the old key alone (no rollback).
          "$signer" rotate --out "$RUNNER_TEMP/lineage" \
            --old-signer --ks "$old" --ks-key-alias echo --ks-pass pass:echo-android --key-pass pass:echo-android \
            --new-signer --ks "$ECHO_KEYSTORE_FILE" --ks-key-alias "$ECHO_KEY_ALIAS" --ks-pass env:ECHO_KEYSTORE_PASSWORD --key-pass env:ECHO_KEY_PASSWORD
          "$signer" lineage --in "$RUNNER_TEMP/lineage" --print-certs -v
          mkdir -p out
          for apk in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-(.*)-release$/\1/')
            dest="out/Echo-${ECHO_VERSION_NAME}-${abi}.apk"
            "$signer" sign --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --alignment-preserved true --rotation-min-sdk-version 28 --lineage "$RUNNER_TEMP/lineage" \
              --ks "$old" --ks-key-alias echo --ks-pass pass:echo-android --key-pass pass:echo-android \
              --next-signer --ks "$ECHO_KEYSTORE_FILE" --ks-key-alias "$ECHO_KEY_ALIAS" --ks-pass env:ECHO_KEYSTORE_PASSWORD --key-pass env:ECHO_KEY_PASSWORD \
              --out "$dest" "$apk"
            # Checked: valid, and the new key signs for Android 9+.
            "$signer" verify --print-certs -v "$dest" | tee verify.txt | grep -E "Verified using|Number of signers|Signer.*SHA-256" || true
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
            "$signer" lineage --in "$dest" --print-certs | tee lineage.txt
            [ "$(grep -c 'SHA-256 digest' lineage.txt)" -ge 2 ]
          done
          ls -la out

      - name: Signing log (when it fails)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f collect.log ] || exit 0
          gh release view ci-logs > /dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI logs" --notes "Build logs" --target "$GITHUB_SHA"
          gh release upload ci-logs collect.log --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: echo-android-${{ env.ECHO_VERSION_NAME }}
          path: out/*.apk

      - name: Publish the version (its own release, older ones kept)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          git fetch --tags --force --quiet
          pick=$'\n\n---\nQuel fichier ? La plupart des téléphones : **arm64-v8a**. Anciens téléphones 32 bits : armeabi-v7a. Émulateurs et Chromebooks : x86_64.'

          # 1. The version that was on "latest" until now gets its own release
          #    (once), with its APKs, before "latest" moves on.
          if gh release view latest > /dev/null 2>&1; then
            old_title=$(gh release view latest --json name -q .name)
            old_full=$(echo "$old_title" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)
            old_version=${old_full%.*}
            if [ -n "$old_version" ] && [ "$old_version" != "$version" ] && ! gh release view "v${old_version}" > /dev/null 2>&1; then
              mkdir -p archive
              gh release download latest --pattern 'Echo-*.apk' --dir archive
              old_sha=$(git rev-list -n 1 refs/tags/latest)
              notes_file="release-notes/${old_version}.md"
              if [ -f "$notes_file" ]; then old_notes="$(cat "$notes_file")"; else old_notes="Écho ${old_version}."; fi
              gh release create "v${old_version}" archive/*.apk --title "Écho ${old_full}" --target "$old_sha" --latest=false \
                --notes "${old_notes}${pick}"$'\n\n'"Build ${old_full} ($(git rev-parse --short "$old_sha"))."
            fi
          fi

          # 2. This version: its own release with real patch notes. A new build
          #    of the same version replaces the files on it.
          notes_file="release-notes/${version}.md"
          if [ -f "$notes_file" ]; then notes="$(cat "$notes_file")"; else notes="Écho ${version}."; fi
          prev=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | grep -vx "$tag" | sort -V | tail -1 || true)
          changelog=""
          if [ -n "$prev" ]; then changelog=$'\n\n'"**Toutes les modifications :** [${prev}...${tag}](https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag})"; fi
          body="${notes}${changelog}${pick}"$'\n\n'"versionName : ${ECHO_VERSION_NAME} · versionCode : ${{ github.run_number }} · commit $(git rev-parse --short HEAD)"
          git tag -f "$tag" "$GITHUB_SHA" && git push -f origin "refs/tags/${tag}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "Écho ${version}" --notes "$body" --latest
            for old in $(gh release view "$tag" --json assets -q '.assets[].name'); do gh release delete-asset "$tag" "$old" -y; done
            gh release upload "$tag" out/*.apk --clobber
          else
            gh release create "$tag" out/*.apk --title "Écho ${version}" --notes "$body" --target "$GITHUB_SHA" --latest
          fi

          # 3. "latest" stays for the apps that still look there (0.0.2 and
          #    older): it carries the newest APKs too.
          gh release view latest > /dev/null 2>&1 || gh release create latest --prerelease --title "Écho" --notes "Canal de mise à jour" --target "$GITHUB_SHA"
          git tag -f latest "$GITHUB_SHA" && git push -f origin refs/tags/latest
          gh release edit latest --prerelease --latest=false --title "Écho ${ECHO_VERSION_NAME} (canal de mise à jour)" \
            --notes "Canal de mise à jour automatique des anciennes versions d’Écho. Les notes de version sont sur [${tag}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}).${pick}"
          for old in $(gh release view latest --json assets -q '.assets[].name'); do gh release delete-asset latest "$old" -y; done
          gh release upload latest out/*.apk --clobber
          if [ -f network-report.txt ]; then gh release upload latest network-report.txt --clobber; fi
